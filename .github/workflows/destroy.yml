name: Destroy

# Tear down one stack. Destroy java-infra (and java-ami for shared) first.
on:
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to destroy
        type: choice
        options: [dev, prod, shared]
        required: true
      confirm:
        description: Type the stack name again to confirm
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.15.8"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  destroy:
    name: destroy (${{ inputs.stack }})
    if: inputs.stack == inputs.confirm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.stack == 'dev' && 'development' || inputs.stack == 'prod' && 'production' || 'shared' }}
    env:
      WORKDIR: ${{ inputs.stack == 'shared' && 'terraform/shared' || format('terraform/environments/{0}', inputs.stack) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/terraform
        with:
          working-directory: ${{ env.WORKDIR }}
          role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
      - name: Destroy
        working-directory: ${{ env.WORKDIR }}
        run: terraform destroy -lock-timeout=5m -auto-approve
